<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">Parisa Crop</title>
  <desc id="desc">Circular Parisa Crop badge with a bow</desc>
  <defs>
    <radialGradient id="bg" cx="35%" cy="25%" r="80%">
      <stop offset="0" stop-color="#fff8ef"/>
      <stop offset=".64" stop-color="#fbf1e4"/>
      <stop offset="1" stop-color="#f4c6cb"/>
    </radialGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ff9aaa"/>
      <stop offset=".55" stop-color="#e85d75"/>
      <stop offset="1" stop-color="#b3364a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f5cb86"/>
      <stop offset=".52" stop-color="#c9793e"/>
      <stop offset="1" stop-color="#9b4e26"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#7a5240" flood-opacity=".25"/>
    </filter>
  </defs>
  <circle cx="120" cy="120" r="111" fill="url(#bg)" stroke="url(#gold)" stroke-width="5"/>
  <circle cx="120" cy="120" r="99" fill="none" stroke="#d9ae6e" stroke-width="1.5" opacity=".8"/>
  <g filter="url(#shadow)">
    <path d="M115 48C91 28 65 25 57 42c-8 18 13 35 55 31z" fill="url(#rose)" stroke="#b3364a" stroke-width="2"/>
    <path d="M125 48c24-20 50-23 58-6 8 18-13 35-55 31z" fill="url(#rose)" stroke="#b3364a" stroke-width="2"/>
    <path d="M99 68 82 104l33-23m26-13 17 36-33-23" fill="url(#rose)" stroke="#b3364a" stroke-width="2" stroke-linejoin="round"/>
    <rect x="109" y="42" width="22" height="37" rx="9" fill="#f88b9d" stroke="#b3364a" stroke-width="2"/>
  </g>
  <text x="120" y="135" text-anchor="middle" fill="#3a2318" font-family="Georgia, serif" font-size="45" font-weight="700" letter-spacing="-2">Parisa</text>
  <text x="134" y="166" text-anchor="middle" fill="#e85d75" font-family="cursive" font-size="34" font-style="italic">Crop</text>
  <path d="M68 181c34 11 70 11 104 0" fill="none" stroke="#c9793e" stroke-width="2" stroke-linecap="round"/>
  <text x="120" y="200" text-anchor="middle" fill="#7a5240" font-family="Arial, sans-serif" font-size="9" letter-spacing="3">CROP &amp; TOP</text>
</svg>
